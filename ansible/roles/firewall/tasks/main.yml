# Installs a firewall

- name: Install firewall packages
  pacman:
    name:
      - nftables
      - ufw
- name: Install additional graphical packages
  when: "firewall_install_graphical_apps == true"
  pacman:
    name:
      - gufw
- name: Start nftables service
  systemd:
    enabled: true
    state: started
    name: nftables
- name: Start ufw service
  systemd:
    enabled: true
    state: started
    name: ufw